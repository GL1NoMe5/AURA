<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 352" width="1000" height="352" role="img" aria-label="Six operational guardrails: Observation first, Sealed test container, Evidence on both sides of a fix, Approval for one version, Checked after deployment, Your apps keep running">
  <defs>
    <linearGradient id="gBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d2633"/>
      <stop offset="100%" stop-color="#091d27"/>
    </linearGradient>
  </defs>
  <style>
    .gtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 16px; font-weight: 600; fill: #e3f0ee; }
    .gdesc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13.5px; fill: #9bb4b8; }
  </style>
  
  <g transform="translate(2,4)">
    <rect x="0" y="0" width="490" height="104" rx="16" fill="url(#gBg)" stroke="#94d5c8" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#13313d" stroke="#94d5c8" stroke-opacity="0.28" stroke-width="1"/>
    <g transform="translate(24,24)"><circle cx="14" cy="14" r="4" fill="none" stroke="#94d5c8" stroke-width="1.6"/><path d="M3 14c2.8-5 6.4-7.5 11-7.5S22.2 9 25 14c-2.8 5-6.4 7.5-11 7.5S5.8 19 3 14Z" fill="none" stroke="#94d5c8" stroke-width="1.6"/></g>
    <text x="72" y="36" class="gtitle">Observation first</text>
    <text x="72" y="60" class="gdesc">New connections only watch. Each recovery</text>
    <text x="72" y="80" class="gdesc">permission is opt-in for that application.</text>
  </g>
  <g transform="translate(508,4)">
    <rect x="0" y="0" width="490" height="104" rx="16" fill="url(#gBg)" stroke="#94d5c8" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#13313d" stroke="#94d5c8" stroke-opacity="0.28" stroke-width="1"/>
    <g transform="translate(24,24)"><path d="M14 3 5 7v6.5c0 5.6 3.8 10.6 9 12 5.2-1.4 9-6.4 9-12V7l-9-4Z" fill="none" stroke="#94d5c8" stroke-width="1.6"/><path d="m10.5 14 2.5 2.5 5-5" fill="none" stroke="#94d5c8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="72" y="36" class="gtitle">Sealed test container</text>
    <text x="72" y="60" class="gdesc">Candidate patches run with no network, all Linux</text>
    <text x="72" y="80" class="gdesc">capabilities dropped and privilege escalation blocked.</text>
  </g>
  <g transform="translate(2,122)">
    <rect x="0" y="0" width="490" height="104" rx="16" fill="url(#gBg)" stroke="#94d5c8" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#13313d" stroke="#94d5c8" stroke-opacity="0.28" stroke-width="1"/>
    <g transform="translate(24,24)"><path d="M5 9h18M5 19h18" stroke="#94d5c8" stroke-width="1.6" stroke-linecap="round"/><circle cx="9" cy="9" r="2.5" fill="#d9ac94"/><circle cx="19" cy="19" r="2.5" fill="#94d5c8"/></g>
    <text x="72" y="36" class="gtitle">Evidence on both sides of a fix</text>
    <text x="72" y="60" class="gdesc">A reproducing test must fail on old code and pass</text>
    <text x="72" y="80" class="gdesc">on new code while existing app tests still pass.</text>
  </g>
  <g transform="translate(508,122)">
    <rect x="0" y="0" width="490" height="104" rx="16" fill="url(#gBg)" stroke="#94d5c8" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#13313d" stroke="#94d5c8" stroke-opacity="0.28" stroke-width="1"/>
    <g transform="translate(24,24)"><rect x="6" y="12" width="16" height="12" rx="3" fill="none" stroke="#94d5c8" stroke-width="1.6"/><path d="M9.5 12V8.5a4.5 4.5 0 0 1 9 0V12" fill="none" stroke="#94d5c8" stroke-width="1.6"/></g>
    <text x="72" y="36" class="gtitle">Approval for one version</text>
    <text x="72" y="60" class="gdesc">Your approval binds to one container state, diff</text>
    <text x="72" y="80" class="gdesc">and test report. Any change needs a new approval.</text>
  </g>
  <g transform="translate(2,240)">
    <rect x="0" y="0" width="490" height="104" rx="16" fill="url(#gBg)" stroke="#94d5c8" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#13313d" stroke="#94d5c8" stroke-opacity="0.28" stroke-width="1"/>
    <g transform="translate(24,24)"><path d="M4 14h4l2.5-6 5 12 2.5-6H24" fill="none" stroke="#94d5c8" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></g>
    <text x="72" y="36" class="gtitle">Checked after deployment</text>
    <text x="72" y="60" class="gdesc">AURA repeats the real request against the running</text>
    <text x="72" y="80" class="gdesc">app and can roll back the container it deployed.</text>
  </g>
  <g transform="translate(508,240)">
    <rect x="0" y="0" width="490" height="104" rx="16" fill="url(#gBg)" stroke="#94d5c8" stroke-opacity="0.22" stroke-width="1"/>
    <rect x="20" y="20" width="36" height="36" rx="10" fill="#13313d" stroke="#94d5c8" stroke-opacity="0.28" stroke-width="1"/>
    <g transform="translate(24,24)"><rect x="4" y="6" width="20" height="16" rx="3" fill="none" stroke="#94d5c8" stroke-width="1.6"/><circle cx="9" cy="14" r="2" fill="#94d5c8"/><line x1="14" y1="14" x2="20" y2="14" stroke="#94d5c8" stroke-width="1.6" stroke-linecap="round"/></g>
    <text x="72" y="36" class="gtitle">Your apps keep running</text>
    <text x="72" y="60" class="gdesc">Closing or stopping AURA leaves connected</text>
    <text x="72" y="80" class="gdesc">Docker applications running untouched.</text>
  </g>
</svg>
